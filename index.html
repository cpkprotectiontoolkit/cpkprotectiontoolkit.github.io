<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="This website has moved to https://itworldss.github.io">
  <title>Website Moved</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    main {
      width: min(760px, 100%);
      padding: 42px;
      border: 1px solid #30363d;
      border-radius: 18px;
      background: #161b22;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.05;
      text-align: center;
    }

    .language {
      padding: 18px 0;
      border-top: 1px solid #30363d;
    }

    .language:first-of-type {
      border-top: 0;
    }

    .language strong {
      display: block;
      margin-bottom: 6px;
      color: #8b949e;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .language p {
      margin: 0;
      font-size: 1.06rem;
      line-height: 1.55;
    }

    .language a {
      color: #3fb950;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid rgba(63, 185, 80, 0.35);
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .language a:hover {
      color: #56d364;
      border-bottom-color: #56d364;
    }

    .language a:focus-visible,
    .destination a:focus-visible {
      outline: 2px solid #58a6ff;
      outline-offset: 4px;
    }

    .destination {
      margin-top: 30px;
      text-align: center;
    }

    .destination a {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      background: #238636;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .destination a:hover {
      background: #2ea043;
      transform: translateY(-1px);
    }

    @media (max-width: 600px) {
      main {
        padding: 28px 22px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Website Moved</h1>

    <section class="language" lang="en">
      <strong>English</strong>
      <p>Our new website is now hosted at <a href="https://itworldss.github.io">itworldss.github.io</a>.</p>
    </section>

    <section class="language" lang="es">
      <strong>Español</strong>
      <p>Nuestro nuevo sitio web ahora está alojado en <a href="https://itworldss.github.io">itworldss.github.io</a>.</p>
    </section>

    <section class="language" lang="id">
      <strong>Bahasa Indonesia</strong>
      <p>Situs web baru kami sekarang tersedia di <a href="https://itworldss.github.io">itworldss.github.io</a>.</p>
    </section>

    <section class="language" lang="zh-CN">
      <strong>中文</strong>
      <p>我们的新网站现已迁移至 <a href="https://itworldss.github.io">itworldss.github.io</a>。</p>
    </section>

    <div class="destination">
      <a href="https://itworldss.github.io">Go to the new website</a>
    </div>
  </main>
</body>
</html>
